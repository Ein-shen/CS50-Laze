<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="/static/styles.css" rel="stylesheet">
        <title>Birthdays</title>
    </head>
    <body>
        <div class="header">
            <h1>Birthdays</h1>
        </div>
        <div class="container">
            <div class="section">

                <h2>Add a Birthday</h2>

                <form  action="/"method="post">
                    <div>
                        <br>
                        <input name="name" placeholder="Name"type="text" style="margin-bottom: 5px;">

                        <br>
                        <input name="day" placeholder="Day" type="number" style="margin-bottom: 5px;">
                        <br>
                        <input name="month" placeholder="Month" type="number" style="margin-bottom: 5px;">
                        <br>

                        <input type="submit" value="Add Birthday">


                    </div>

                </form>
                <!-- TODO: Create a form for users to submit a name, a month, and a day -->

                





            </div>

            <div class="section">

                <h2>All Birthdays</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Birthday</th>

                        </tr>
                    </thead>
                    <tbody>

                        <!-- TODO: Loop through the database entries to display them in this table -->

                        {%for row in rows%}

                        <tr>

                            <td> {{row.name}}</td>
                            <td>{{row.month}}/{{row.day}}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>

<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions
            function checkMultipleChoice(event){

                let button = event.target;

                if (button.innerHTML == "6 people with 1 sheep" ){
                    button.style.backgroundColor = 'Green';
                    button.parentElement.querySelector('.feedback').innerHTML = "Correct!";

                }
                else{
                    button.style.backgroundColor = 'Red';
                    button.parentElement.querySelector('.feedback').innerHTML = "Incorrect!";

                }
            }

            function checkFreeResponse(event){
                let button = event.target;

                let input = button.parentElement.querySelector('input');

                if (input.value == 'Switzerland'){
                    input.style.backgroundColor = 'Green';
                    input.parentElement.querySelector('.feedback').innerHTML = 'Correct!';

                }
                else{
                    input.style.backgroundColor = 'Red';
                    input.parentElement.querySelector('.feedback').innerHTML = 'Incorrect!';
                }

            }

        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                <h3> What is the approximate ratio of people to sheep in New Zealand?</h3>
                <button onclick="checkMultipleChoice(event)">6 people with 1 sheep</button>
                <button onclick="checkMultipleChoice(event)">3 people with 1 sheep</button>
                <button onclick="checkMultipleChoice(event)">1 people with 1 sheep</button>
                <button onclick="checkMultipleChoice(event)">1 people with 3 sheep</button>
                <button onclick="checkMultipleChoice(event)">1 people with 6 sheep</button>
                <p class="feedback"></p>

            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                <h3> In Which country it is illegal to own only one geunipig, as a lone geunipig might get lonely?</h3>
                <input id ="text"></input>
                <button onclick="checkFreeResponse(event)"> check answer</button>
                <p class="feedback"></p>


            </div>
        </div>


    </body>
</html>
